# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p exar-local up -d --force-recreate
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exar
      POSTGRES_PASSWORD: exar
      POSTGRES_DB: exar
    ports:
      - "5434:5432"
    volumes:
      - exar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exar -d exar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      ADDR: "0.0.0.0:8080"
      DATABASE_URL: postgres://exar:exar@postgres:5432/exar?sslmode=disable
      GIN_MODE: debug
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - exar-gomod:/go/pkg/mod
      - exar-gotmp:/app/tmp
    ports:
      - "8176:8080"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/exar/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8080
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../exar-webui:/app
      - exar-webui-node-modules:/app/node_modules
    ports:
      - "5177:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  exar-postgres-data:
  exar-gomod:
  exar-gotmp:
  exar-webui-node-modules:

networks:
  pc-armin-local:
    external: true
